plugins { id 'com.android.application' }
android {
    namespace 'dev.navifold.player'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.navifold.player.next'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '0.9.0-dev'
        manifestPlaceholders = [appLabel: 'NaviFold Next']
    }
    buildTypes {
        qa {
            initWith debug
            applicationIdSuffix '.qa'
            versionNameSuffix '-qa'
            manifestPlaceholders = [appLabel: 'NaviFold Next QA']
            matchingFallbacks = ['debug']
        }
    }
    sourceSets { qa { manifest.srcFile 'src/qa/AndroidManifest.xml' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
