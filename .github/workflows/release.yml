name: Android test release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Prepare download
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/NaviFold-${GITHUB_REF_NAME}-debug.apk"
          cd release
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --prerelease --title "NaviFold $GITHUB_REF_NAME" --notes-file docs/releases/v0.8.4.md
