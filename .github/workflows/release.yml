name: Android test release
on:
  push:
    tags: ['v*']
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Prepare download
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/NaviFold-v0.8.4-debug.apk"
          cd release
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.8.4
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already published; leaving existing assets unchanged."
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --title "NaviFold $RELEASE_TAG" --notes-file docs/releases/v0.8.4.md
          fi
